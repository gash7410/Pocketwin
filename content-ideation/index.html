<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ιδέες περιεχομένου</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Ιδέες περιεχομένου</h1>
    <p class="subtitle">Βρες ιδέες για τα social media σου, με γάντζο, δομή και hashtags.</p>
  </header>

  <main>
    <section class="card">
      <form id="idea-form" novalidate>
        <label class="field">
          <span>Θέμα ή κλάδος</span>
          <input id="topic" name="topic" type="text" maxlength="80" placeholder="π.χ. καφές, fitness, ζωγραφική" autocomplete="off" required>
        </label>

        <div class="grid">
          <label class="field">
            <span>Πλατφόρμα</span>
            <select id="platform" name="platform"></select>
          </label>

          <label class="field">
            <span>Μορφή</span>
            <select id="format" name="format"></select>
          </label>

          <label class="field">
            <span>Στόχος</span>
            <select id="goal" name="goal"></select>
          </label>

          <label class="field">
            <span>Τόνος</span>
            <select id="tone" name="tone"></select>
          </label>
        </div>

        <p id="form-error" class="error" role="alert" hidden></p>

        <button type="submit" class="primary">Βρες ιδέες</button>
      </form>
    </section>

    <nav class="tabs" role="tablist" aria-label="Προβολή">
      <button type="button" role="tab" id="tab-ideas" aria-controls="panel-ideas" aria-selected="true" data-view="ideas">Ιδέες</button>
      <button type="button" role="tab" id="tab-saved" aria-controls="panel-saved" aria-selected="false" data-view="saved">
        Αποθηκευμένες <span id="saved-count" class="count">0</span>
      </button>
    </nav>

    <section id="panel-ideas" role="tabpanel" aria-labelledby="tab-ideas">
      <div class="toolbar">
        <p id="platform-tip" class="tip"></p>
        <button type="button" id="regenerate" class="secondary" hidden>Νέες ιδέες</button>
      </div>
      <div id="results" class="results">
        <p class="empty">Γράψε ένα θέμα και πάτα «Βρες ιδέες».</p>
      </div>
    </section>

    <section id="panel-saved" role="tabpanel" aria-labelledby="tab-saved" hidden>
      <div id="saved" class="results"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/ideas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
